name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out spectator overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: overlay
          persist-credentials: false

      - name: Check out pinned rs-sdk runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MaxBittker/rs-sdk
          ref: 2ae032c99813a72d8d749d6d105fc7378255b03a
          path: runtime
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install runtime dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: Install webclient dependencies
        working-directory: runtime/server/webclient
        run: bun install --frozen-lockfile

      - name: Apply tracked overlay
        run: |
          mkdir -p runtime/spikes
          rsync -a --delete overlay/spectator/ runtime/spectator/
          rsync -a --delete overlay/full-client-stream/ runtime/spikes/001-full-client-stream/

      - name: Test dashboard
        working-directory: runtime
        run: bun test spectator

      - name: Test rendered-client stream
        working-directory: runtime
        run: bun test spikes/001-full-client-stream

      - name: Check pinned runtime
        working-directory: runtime
        run: bun run check

      - name: Test deployment contract
        working-directory: overlay
        run: bash deploy/test/install-test.sh

      - name: Validate shell and Cloudflare ingress
        working-directory: overlay
        run: |
          bash -n deploy/install.sh deploy/verify.sh deploy/test/install-test.sh
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64 -o /tmp/cloudflared
          echo 'fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2  /tmp/cloudflared' | sha256sum --check --strict
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --config deploy/cloudflared/momobot.yml ingress validate

      - name: Validate systemd files against production paths
        working-directory: overlay
        run: |
          sudo install -m 0755 /tmp/cloudflared /usr/bin/cloudflared
          sudo install -d /home/moltbot/.bun/bin /home/moltbot/clawd/rs-sdk
          sudo ln -sf "$(command -v bun)" /home/moltbot/.bun/bin/bun
          if [[ $(command -v node) != /usr/bin/node ]]; then sudo ln -sf "$(command -v node)" /usr/bin/node; fi
          systemd-analyze verify deploy/systemd/*.service
